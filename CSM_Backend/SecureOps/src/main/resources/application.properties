spring.application.name=sentinel-security

# Database Configuration (supports dynamic environment variables with safe defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/CloudSecurity?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Token Configuration (Encoded for security on Git repositories)
jwt.secret=${JWT_SECRET:ENC:c2VudGluZWwtc2VjdXJpdHktc3VwZXItc2VjcmV0LWtleS0yMDI2LWNsb3VkLW1vbml0b3Jpbmc=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Sentinel AI Gateway Configuration
# The API key is Base64 encoded (ENC:...) so Git accepts and does not expose plaintext secrets on any clone
sentinelcore.ai.opencode.api-key=${SENTINEL_OPENCODE_API_KEY:ENC:c2stNzU0YjIyOTRjNTkxNTMxNy03ZWJjMmQtZGM5NmUwYzU=}
sentinelcore.ai.opencode.model=${SENTINEL_OPENCODE_MODEL:56782247-f579-40a8-a5cc-6d0684ded134}
sentinelcore.ai.opencode.endpoint=${SENTINEL_OPENCODE_ENDPOINT:http://localhost:20128/v1/chat/completions}

#logging.level.org.springframework.security=DEBUG